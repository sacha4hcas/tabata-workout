<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout</title>
  <link rel="stylesheet" href="../Ressources/style.css" />
</head>
<body data-page="workout">
  <header>
    <h1>Workout</h1>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="manage_profiles.html">Manage Profile</a>
      <a class="nav-link" href="manage_categories.html">Categories</a>
      <a class="nav-link" href="manage_workouts.html">Manage Workouts</a>
      <a class="nav-link" href="manage_exercices.html">Manage Exercices</a>
    </nav>
  </header>
  <main class="page-card workout-shell">
    <section class="workout-hero">
      <p class="workout-kicker">Active session</p>
      <h2 id="workoutNameLabel" class="workout-title">Workout Name</h2>
      <div class="workout-summary">
        <article class="metric-card">
          <span class="metric-label">Global timer</span>
          <div id="globalTimer" class="timer-value timer-value--hero">00:00</div>
        </article>
      </div>
    </section>
    <section id="phaseStage" class="phase-stage">
      <p class="phase-stage__label">Current phase</p>
      <div id="currentPhaseName" class="phase-stage__name">Preparation</div>
      <div id="exerciceTimer" class="phase-stage__timer">00:00</div>
    </section>
    <section class="workout-grid">
      <article class="workout-card workout-card--current">
        <p class="workout-card__label">Current exercise</p>
        <div id="currentExerciceName" class="workout-card__value"></div>
        <div id="exerciceMediaHolder" class="workout-media workout-media--card">
          <img id="exerciceMedia" src="" alt="Exercise media" />
        </div>
      </article>
      <article class="workout-card workout-card--next">
        <p class="workout-card__label">Next exercise</p>
        <div id="nextExerciceName" class="workout-card__value workout-card__value--muted"></div>
      </article>
    </section>
    <section class="button-row workout-controls">
      <button id="pauseResume" class="button">Pause</button>
      <button id="skipExercise" class="button secondary">Skip</button>
      <button id="stopWorkout" class="button secondary">Stop</button>
    </section>
    <section id="workoutDoneActions" class="button-row workout-controls"></section>
  </main>
  <script src="../Script/app.js"></script>
</body>
</html>
