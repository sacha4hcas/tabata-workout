<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats</title>
  <link rel="stylesheet" href="../Ressources/style.css" />
</head>
<body data-page="stats">
  <header>
    <h1>Stats</h1>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="manage_profiles.html">Manage Profile</a>
      <a class="nav-link" href="manage_categories.html">Categories</a>
      <a class="nav-link" href="manage_workouts.html">Manage Workouts</a>
      <a class="nav-link" href="manage_exercices.html">Manage Exercices</a>
    </nav>
  </header>
  <main class="page-card">
    <section>
      <h2>Workout History</h2>
      <div id="statsList" class="list-card"></div>
    </section>
    <section>
      <label for="statsJsonData">Stats JSON</label>
      <textarea id="statsJsonData" rows="10" placeholder="Stats JSON will appear here"></textarea>
      <div class="button-row">
        <button id="downloadJson" class="button">Download JSON</button>
        <button id="loadJson" class="button secondary">Load JSON</button>
        <label class="file-label">
          <span class="button small">Choose file</span>
          <input id="importJsonFile" type="file" accept="application/json" />
        </label>
      </div>
    </section>
  </main>
  <script src="../Script/app.js"></script>
</body>
</html>
