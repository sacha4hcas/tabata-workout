<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Workout</title>
  <link rel="stylesheet" href="../Ressources/style.css" />
</head>
<body data-page="start_workout">
  <header>
    <h1>Start Workout</h1>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="manage_profiles.html">Manage Profile</a>
      <a class="nav-link" href="manage_categories.html">Categories</a>
      <a class="nav-link" href="manage_workouts.html">Manage Workouts</a>
      <a class="nav-link" href="manage_exercices.html">Manage Exercices</a>
    </nav>
  </header>
  <main class="page-card">
    <section>
      <div class="choice-row">
        <label>
          <input id="typeWorkout" name="startType" type="radio" value="workout" checked /> Workout
        </label>
        <label>
          <input id="typeCategories" name="startType" type="radio" value="categories" /> Categories
        </label>
      </div>
      <div id="workoutSection">
        <label for="workoutSelect">Select workout</label>
        <select id="workoutSelect"></select>
      </div>
      <div id="categoriesSection" style="display: none;">
        <label>Select categories</label>
        <label class="checkbox-toggle" for="selectAllCategories">
          <input id="selectAllCategories" type="checkbox" /> Select all categories
        </label>
        <div id="categoriesCheckboxes" class="checkbox-group"></div>
      </div>
      <div class="choice-row">
        <label>
          <input id="modeFull" name="workoutMode" type="radio" value="full" checked /> Full workout
        </label>
        <label>
          <input id="modeInfinite" name="workoutMode" type="radio" value="infinite" /> Infinite workout
        </label>
      </div>
      <label>
        <input id="randomOrder" type="checkbox" checked /> Random order
      </label>
    </section>
    <section>
      <button id="startWorkout" class="button">Start</button>
    </section>
  </main>
  <script src="../Script/app.js"></script>
</body>
</html>
