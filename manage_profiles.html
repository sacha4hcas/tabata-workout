<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="manage_profiles">
  <header>
    <h1>Manage Profile</h1>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="manage_profiles.html">Manage Profile</a>
      <a class="nav-link" href="manage_categories.html">Categories</a>
      <a class="nav-link" href="manage_workouts.html">Manage Workouts</a>
      <a class="nav-link" href="manage_exercices.html">Manage Exercices</a>
      <a class="nav-link" href="stats.html">Stats</a>
    </nav>
  </header>
  <main class="page-card">
    <section>
      <label for="profileName">Name</label>
      <input id="profileName" type="text" placeholder="Enter profile name" />
    </section>
    <section>
      <a class="button" href="manage_workouts.html">Manage Workouts</a>
      <a class="button" href="manage_exercices.html">Manage Exercices</a>
      <a class="button secondary" href="stats.html">See stats</a>
    </section>
    <section>
      <label for="profileJsonData">Profile JSON</label>
      <textarea id="profileJsonData" rows="8" placeholder="Paste profile JSON here"></textarea>
      <div class="button-row">
        <button id="downloadJson" class="button">Download JSON</button>
        <button id="loadJson" class="button secondary">Load JSON</button>
        <button id="loadSample" class="button secondary">Load Sample Data</button>
        <label class="file-label">
          <span class="button small">Choose file</span>
          <input id="importJsonFile" type="file" accept="application/json" />
        </label>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
